# ===============================
# MIND OS Backend Configuration
# ===============================
server.port=8081

# --- Database Connection (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mindflow_db
spring.datasource.username=postgres
spring.datasource.password=Nikitha@03
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate/JPA Configuration ---
# 'update' will modify the schema if entities change.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect is auto-detected by Hibernate 6 - no need to set explicitly
spring.jpa.open-in-view=false

# --- Security (Temporary disable for initial dev) ---
spring.security.user.name=admin
spring.security.user.password=admin

# --- Multipart File Upload Configuration ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# --- Object Storage / File Storage Configuration (Vercel & Cloud Production Ready) ---
# Supported providers: 'local' (for local development/testing) or 's3' (for AWS S3, Cloudflare R2, Supabase Storage S3 API, MinIO)
storage.provider=${STORAGE_PROVIDER:local}
storage.local.upload-dir=${STORAGE_LOCAL_DIR:uploads/documents}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
storage.s3.bucket=${STORAGE_S3_BUCKET:mindos-documents}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}

# Backward compatibility alias
file.upload-dir=${storage.local.upload-dir}

# --- Embedding & Vector Configuration (STEP 4.6) ---
# Supported providers: 'local' (deterministic offline provider), 'openai', 'gemini'
embedding.provider=${EMBEDDING_PROVIDER:local}
embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
embedding.dimension=${EMBEDDING_DIMENSION:1536}
embedding.api-key=${EMBEDDING_API_KEY:}
embedding.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# --- Knowledge Base & Semantic Search Configuration (STEP 4.7) ---
knowledge.search.similarity-threshold=${KNOWLEDGE_SEARCH_SIMILARITY_THRESHOLD:0.40}
knowledge.search.default-top-k=${KNOWLEDGE_SEARCH_DEFAULT_TOP_K:5}
knowledge.search.max-top-k=${KNOWLEDGE_SEARCH_MAX_TOP_K:10}

# --- LLM & RAG Pipeline Configuration (STEP 4.8) ---
# Supported providers: 'local' (offline grounded synthesis), 'openai', 'gemini'
llm.provider=${LLM_PROVIDER:local}
llm.model=${LLM_MODEL:gpt-4o-mini}
llm.api-key=${LLM_API_KEY:}
llm.temperature=${LLM_TEMPERATURE:0.2}
llm.max-tokens=${LLM_MAX_TOKENS:1000}
llm.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
llm.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}


